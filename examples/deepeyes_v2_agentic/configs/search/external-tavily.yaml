backend: external
top_k: 5
timeout_s: 10
max_retries: 2
backoff_s: 0.5
trust_env: false
max_observation_chars: 12000
external:
  endpoint: https://api.tavily.com/search
  method: POST
  request_fields:
    query: query
    size: max_results
  static_fields:
    search_depth: basic
    include_answer: false
    include_raw_content: false
    include_images: false
  results_path: results
  result_fields:
    title: title
    link: url
    snippet: content
    date: published_date
  auth:
    header: Authorization
    prefix: "Bearer "
    env: TAVILY_API_KEY
