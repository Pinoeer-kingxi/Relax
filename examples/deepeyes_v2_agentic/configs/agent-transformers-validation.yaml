# Local validation profile for ``transformers serve``, which does not accept
# SGLang's ``stop_token_ids`` extension. Production training continues to use
# app/deepeyes_v2_config.yaml.
max_turns: 9
max_completion_tokens: 256
code_timeout_s: 200
ensure_sandbox_timeout_s: 240
sandbox_backend: apptainer_jupyter
stop_token_ids: []
web_search:
  backend: mock
  top_k: 5
  max_observation_chars: 12000
  cache_ttl_s: 0
  cache_max_entries: 128
  circuit_breaker_failures: 5
  circuit_breaker_reset_s: 30
